name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q aik.py .agents tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Validate example
        run: python aik.py validate examples/support-agent/confirmation-before-action
      - name: Generate example review
        run: python aik.py demo
