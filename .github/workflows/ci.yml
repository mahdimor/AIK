name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q aik.py .agents tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Validate example
        run: python aik.py validate examples/support-agent/confirmation-before-action
      - name: Generate example review
        run: python aik.py demo
      - name: Exercise command runner
        run: |
          python aik.py run examples/execution-bridge --stage baseline --overwrite -- python examples/runners/fake_agent.py
          python aik.py run examples/execution-bridge --stage candidate --overwrite -- python examples/runners/fake_agent.py
          python aik.py review examples/execution-bridge

  langgraph-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional LangGraph demo
        run: python -m pip install -r examples/langgraph-multi-agent/requirements.txt
      - name: Test LangGraph demo without API calls
        run: python -m unittest tests.test_langgraph_demo -v
