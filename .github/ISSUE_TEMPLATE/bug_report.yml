name: Bug report
description: Report a reproducible problem in AIK
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Use synthetic, redacted evidence only. For vulnerabilities, use the private process in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: AIK version or commit
      placeholder: v0.5.0 or 4331cd6
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version and operating system
      placeholder: Python 3.12.4 on Windows 11
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Exact command, with secrets and private paths removed
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Steps and synthetic input needed to reproduce the problem
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the error text or redacted output
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I removed credentials, personal data, private prompts, customer content, and internal identifiers.
          required: true
        - label: This report does not disclose a security vulnerability.
          required: true
